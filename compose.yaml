# The Postgres the tests need: `docker compose up -d`, then
# DATABASE_URL=postgresql://postgres:test@localhost:5432/rws
services:
  postgres:
    image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rws
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rws"]
      interval: 2s
      timeout: 5s
      retries: 20
