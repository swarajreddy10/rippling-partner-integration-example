# The Postgres the tests need: `docker compose up -d`, then
# DATABASE_URL=postgresql://postgres:test@localhost:5432/rws
services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rws
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rws"]
      interval: 2s
      timeout: 5s
      retries: 20
