# The Postgres the tests need: `docker compose up -d`, then
# DATABASE_URL=postgresql://postgres:test@localhost:5432/rws
services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rws
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "rws"]
      interval: 2s
      timeout: 5s
      retries: 20
