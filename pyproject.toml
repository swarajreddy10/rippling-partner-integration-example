[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "rippling-partner-integration-example"
version = "0.1.0"
description = "Unofficial example of a Rippling App Shop partner integration: OAuth install and employee sync, built from Rippling's published v2 API documentation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swaraj Chandra Reddy M" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.14,<3",
    "starlette>=1.10,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "cryptography>=45",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.35"]

[project.urls]
Repository = "https://github.com/swarajreddy10/rippling-partner-integration-example"

# Tools for working on the project; PEP 735 keeps them out of the published metadata.
[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]
markers = ["db: needs a real Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PERF", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed fake credentials against a local fake.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"
